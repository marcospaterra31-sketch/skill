# ==============================================================================
# SKILL FORGE — NETLIFY CONFIGURATION (PRODUÇÃO & PREVIEWS)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Encaminha chamadas de API para a Netlify Serverless Function (Express Backend)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api/healthz"
  status = 200
  force = true

# Roteamento SPA padrão (React Router / Vite) para todas as telas do aplicativo
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de Segurança HTTP recomendados pela auditoria de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Otimização de Cache imutável para assets Vite (JS, CSS, SVGs versionados)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
